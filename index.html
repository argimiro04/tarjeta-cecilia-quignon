<style>
/* ============================================================
   1. VARIABLES  —  TODO EL ESTILO SE CAMBIA DESDE AQUI
   Paleta y tipografias definitivas: PENDIENTE (las decide Argi).
   ============================================================ */
:root {

  /* --- Tipografias -------------------------------------------------
     Para poner la fuente del titulo: anadir su @font-face o el <link>
     de Google Fonts en el <head> y cambiar SOLO esta variable.       */
  --fuente-titulo:   Georgia, "Times New Roman", serif;   /* nombre + subtitulo */
  --fuente-texto:    system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;

  /* Tamanos (se adaptan solos entre movil y escritorio) */
  --tam-titulo:       clamp(2.1rem, 11vw, 3.4rem);
  --tam-subtitulo:    clamp(0.95rem, 4vw, 1.15rem);
  --tam-texto:        1rem;
  --grosor-titulo:    400;
  --espaciado-titulo: 0.02em;   /* separacion entre letras del nombre */

  /* --- Colores -----------------------------------------------------
     Fondo general de la pagina                                       */
  --color-fondo:            #f5f7f9;
  /* Texto normal (bio, titulos de obra, contacto) */
  --color-texto:            #2b2a28;
  /* Texto secundario (subtitulo, ano, tecnica) */
  --color-texto-suave:      #6f6c67;
  /* Nombre de la artista */
  --color-titulo:           #4398CE;

  /* Barra de navegacion */
  --color-barra-fondo:      #faf9f7;
  --color-barra-texto:      #6f6c67;
  --color-barra-activo:     #2b2a28;   /* enlace de la seccion visible */
  --color-barra-borde:      #e2ded7;   /* linea inferior de la barra   */

  /* Cuadro de la bio
     Tono a medio camino entre el fondo de la pagina y un azul grisaceo:
     marca que ahi hay un cuadro de texto, pero sin llamar la atencion.
     El fondo se monta con dos piezas para tocar color y transparencia
     por separado:
       --color-caja-tinte   = el color, en R,G,B (225,233,238 es #E1E9EE)
       --caja-transparencia = cuanto se ve (0 = invisible, 1 = color solido) */
  --color-caja-tinte:       225, 233, 238;
  --caja-transparencia:     .75;
  --color-caja-fondo:       rgba(var(--color-caja-tinte), var(--caja-transparencia));
  --color-caja-borde:       #2b2a28;   /* solo se usa si se vuelve a poner borde */
  --grosor-caja-borde:      0;         /* 0 = sin borde; 1px lo devuelve         */
  --caja-redondeo:          22px;      /* puntas redondeadas; 0 = esquinas rectas */

  /* Obras (mientras no haya fotos se ve este gris) */
  --color-obra-fondo:       #e6e3de;
  --color-obra-borde:       #2b2a28;
  --grosor-obra-borde:      1px;

  /* Separadores de puntos */
  --color-puntos:           #9b968e;
  --tam-punto:              2px;    /* grosor del punto        */
  --separacion-puntos:      9px;    /* distancia entre puntos  */

  /* Enlaces de contacto */
  --color-enlace:           #2b2a28;

  /* Lightbox (ampliacion de la obra) */
  --color-lightbox-fondo:   rgba(20, 19, 18, 0.92);
  --color-lightbox-texto:   #faf9f7;

     Imagen que se repite por detras de todo el contenido.
     Para cambiar el dibujo, sustituir --patron-imagen por otra imagen:
     url("data:image/png;base64,...")  o  url("fondo.png") si va suelta. */

  /* --- Medidas ----------------------------------------------------- */
  --ancho-maximo:     980px;   /* ancho maximo del contenido en pantalla grande */
  --margen-lateral:   22px;    /* aire a izquierda y derecha */
  --ancho-obra:       60%;     /* ancho de cada obra en movil (pedido: 55-65 %) */
  --alto-barra:       52px;
}


/* ============================================================
   2. BASE
   ============================================================ */
* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  /* para que la barra fija no tape el inicio de la seccion al saltar */
  scroll-padding-top: calc(var(--alto-barra) + env(safe-area-inset-top, 0px) + 12px);
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}

body {
  margin: 0;
  background: var(--color-fondo);
  color: var(--color-texto);
  font-family: var(--fuente-texto);
  font-size: var(--tam-texto);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
}

img { max-width: 100%; display: block; }
[hidden] { display: none !important; }

.contenedor {
  max-width: var(--ancho-maximo);
  margin: 0 auto;
  padding-left: var(--margen-lateral);
  padding-right: var(--margen-lateral);
}


/* ============================================================
   3. BARRA DE NAVEGACION (fija arriba)
   ============================================================ */
.barra {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--color-barra-fondo);
  border-bottom: 1px solid var(--color-barra-borde);
  padding-top: env(safe-area-inset-top, 0px);
}

.barra nav {
  height: var(--alto-barra);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(14px, 6vw, 40px);
}

.barra a {
  color: var(--color-barra-texto);
  text-decoration: none;
  font-size: 0.86rem;
  letter-spacing: 0.06em;
  padding: 10px 2px;          /* zona de toque comoda en movil */
  border-bottom: 1.5px solid transparent;
  transition: color .2s ease, border-color .2s ease;
}

.barra a.activo {
  color: var(--color-barra-activo);
  border-bottom-color: var(--color-barra-activo);
}


/* ============================================================
   4. CABECERA / SOBRE MI
   ============================================================ */
.cabecera {
  padding-top: clamp(48px, 14vw, 90px);
  padding-bottom: clamp(40px, 12vw, 80px);
  text-align: center;
}

.nombre {
  font-family: var(--fuente-titulo);
  font-weight: var(--grosor-titulo);
  font-size: var(--tam-titulo);
  letter-spacing: var(--espaciado-titulo);
  color: var(--color-titulo);
  line-height: 1.15;
  margin: 0;
}

.subtitulo {
  font-family: var(--fuente-titulo);
  font-size: var(--tam-subtitulo);
  color: var(--color-texto-suave);
  font-style: italic;
  margin: 14px 0 0;
}

/* Cuadro de la bio */
.bio {
  max-width: 460px;
  margin: clamp(36px, 11vw, 60px) auto 0;
  padding: clamp(20px, 6vw, 30px);
  background: var(--color-caja-fondo);
  border: var(--grosor-caja-borde) solid var(--color-caja-borde);
  border-radius: var(--caja-redondeo);
  text-align: center;
}

.bio p { margin: 0; }


/* ============================================================
   5. SEPARADORES DE PUNTOS
   ------------------------------------------------------------
   .separador            -> puntos · palabra · puntos  (Galeria)
   .separador--completo  -> puntos de lado a lado      (Contacto)
   ============================================================ */
.puntos {
  flex: 1;
  height: var(--tam-punto);
  background-image: radial-gradient(
      circle,
      var(--color-puntos) calc(var(--tam-punto) / 2),
      transparent calc(var(--tam-punto) / 2)
  );
  background-size: var(--separacion-puntos) var(--tam-punto);
  background-repeat: repeat-x;
  background-position: center;
}

.separador {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: clamp(10px, 4vw, 20px) 0 clamp(36px, 10vw, 56px);
}

.separador h2 {
  margin: 0;
  font-family: var(--fuente-titulo);
  font-weight: var(--grosor-titulo);
  font-size: clamp(1.05rem, 4.6vw, 1.35rem);
  color: var(--color-titulo);
  white-space: nowrap;
}

.separador--completo {
  margin: clamp(48px, 14vw, 80px) 0 clamp(30px, 9vw, 48px);
}

/* el separador de contacto es solo linea: el titulo queda para lectores de pantalla */
.separador--completo h2 {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}


/* ============================================================
   6. GALERIA (zigzag)
   ============================================================ */
.galeria {
  display: flex;
  flex-direction: column;
  gap: clamp(40px, 13vw, 70px);
}

.obra {
  width: var(--ancho-obra);
  margin: 0;
  text-align: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* zigzag: impares a la izquierda, pares a la derecha */
.obra:nth-child(odd)  { align-self: flex-start; }
.obra:nth-child(even) { align-self: flex-end; }

/* marco de la obra */
.obra .marco {
  aspect-ratio: 1 / 1;   /* cuadrado solo en los huecos sin foto */
  background: var(--color-obra-fondo);
  border: var(--grosor-obra-borde) solid var(--color-obra-borde);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity .2s ease;
}

/* con foto dentro, manda la proporcion real de la obra */
.obra .marco:has(img) { aspect-ratio: auto; }

.obra .marco img {
  width: 100%;
  height: auto;
  display: block;
}

.obra:hover .marco,
.obra:focus-visible .marco { opacity: .82; }

.obra:focus-visible { outline: 2px solid var(--color-titulo); outline-offset: 6px; }

/* rotulo de relleno, para huecos que todavia no tengan foto */
.obra .marco span {
  font-size: 0.8rem;
  color: var(--color-texto-suave);
  letter-spacing: 0.08em;
}

.obra figcaption {
  margin-top: 12px;
  font-size: 0.92rem;
  line-height: 1.4;
}

.obra .anio {
  display: block;
  font-size: 0.8rem;
  color: var(--color-texto-suave);
}


/* ============================================================
   7. CONTACTO
   ============================================================ */
.contacto {
  text-align: center;
  padding-bottom: 20px;
}

.contacto ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.contacto a {
  color: var(--color-enlace);
  text-decoration: none;
  border-bottom: 1px solid var(--color-puntos);
  padding-bottom: 3px;
  display: inline-block;
}

/* aviso de autoria: discreto, cierra la pagina */
.copyright {
  margin: clamp(30px, 9vw, 46px) 0 0;
  font-size: 0.74rem;
  letter-spacing: 0.03em;
  color: var(--color-texto-suave);
}


/* ============================================================
   8. LIGHTBOX (ampliacion de la obra en la misma pagina)
   ============================================================ */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--color-lightbox-fondo);
  color: var(--color-lightbox-texto);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  padding: calc(60px + env(safe-area-inset-top, 0px)) var(--margen-lateral)
           calc(28px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
}

.lightbox .marco-grande {
  max-width: min(88vw, 520px);
  background: var(--color-obra-fondo);
  border: var(--grosor-obra-borde) solid var(--color-obra-borde);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 1 auto;
  min-height: 0;         /* deja que una obra vertical se encoja si hace falta */
}

/* la obra ampliada: entera en pantalla, sin deformar y sin desbordar */
.lightbox .marco-grande img {
  display: block;
  max-width: 100%;
  max-height: 62vh;
  width: auto;
  height: auto;
  object-fit: contain;
}

.lightbox .ficha {
  text-align: center;
  max-width: 420px;
}

.lightbox .ficha h3 {
  font-family: var(--fuente-titulo);
  font-weight: var(--grosor-titulo);
  font-size: 1.25rem;
  margin: 0 0 8px;
}

.lightbox .ficha p {
  margin: 0;
  font-size: 0.9rem;
  opacity: .8;
  line-height: 1.6;
}

.lightbox .cerrar {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: 12px;
  width: 44px;
  height: 44px;
  background: none;
  border: 0;
  color: var(--color-lightbox-texto);
  font-size: 1.7rem;
  line-height: 1;
  cursor: pointer;
}


/* ============================================================
   9. PATRON DEL FONDO
   ------------------------------------------------------------
   Capa que repite la imagen por toda la pagina, por detras del
   contenido. Se ajusta con --patron-opacidad y --patron-tam,
   en el bloque de variables de arriba.
   ============================================================ */
body { position: relative; }

.fondo-patron {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;          /* nunca estorba al pulsar */
  background-image: var(--patron-imagen);
  background-repeat: repeat;
  background-size: var(--patron-tam) auto;
  opacity: var(--patron-opacidad);
}

/* el contenido siempre por encima del patron
   (la barra y el lightbox ya van por delante con su z-index) */
main { position: relative; z-index: 1; }


/* ============================================================
   10. PANTALLAS GRANDES (la maqueta esta pensada primero para movil)
   ============================================================ */
@media (min-width: 720px) {
  :root {
    --ancho-obra: 38%;
    --patron-tam: 190px;   /* en pantalla ancha, motivos algo mayores */
  }
}
</style>
</head>

<body>

<!-- Patron del fondo (decoracion: se ignora en lectores de pantalla) -->
<div class="fondo-patron" aria-hidden="true"></div>


<!-- ===== Barra fija ===== -->
<header class="barra">
  <nav class="contenedor" aria-label="Secciones">
    <a href="#sobre-mi" data-enlace="sobre-mi">Sobre mí</a>
    <a href="#galeria"  data-enlace="galeria">Galería</a>
    <a href="#contacto" data-enlace="contacto">Contacto</a>
  </nav>
</header>

<main>

  <!-- ===== 1. Cabecera / Sobre mi ===== -->
  <section id="sobre-mi" class="cabecera contenedor">
    <h1 class="nombre">Cecilia Quignón</h1>

    <!-- PENDIENTE: subtitulo real (lo confirma Cecilia). Marcador de posicion. -->
    <p class="subtitulo">Artista plástica</p>

    <!-- PENDIENTE: bio real. Aqui va el texto cuando lo mande Cecilia. -->
    <div class="bio">
      <p>Rellenar</p>
    </div>
  </section>


  <!-- ===== 2. Galeria ===== -->
  <section id="galeria" class="contenedor">

    <div class="separador">
      <span class="puntos" aria-hidden="true"></span>
      <h2>Galería</h2>
      <span class="puntos" aria-hidden="true"></span>
    </div>

    <!-- Las fotos ya son las definitivas. Falta el texto de cada obra:
         PENDIENTE titulo, ano, tecnica y precio (los manda Cecilia).
         Cuando lleguen: cambiar el "Rellenar" del figcaption, rellenar
         data-anio y data-tecnica, y poner el titulo en el alt de la imagen.
         Para anadir o quitar obras basta con copiar o borrar un bloque
         <figure>: el zigzag se recoloca solo. -->
    <div class="galeria">

      <figure class="obra" role="button" tabindex="0"
              data-img="imagenes/obra-01.webp"
              data-titulo="Rellenar" data-anio="" data-tecnica="">
        <div class="marco">
          <img src="imagenes/obra-01.webp" alt="Obra de Cecilia Quignón"
               width="1400" height="1040" decoding="async">
        </div>
        <figcaption>Rellenar</figcaption>
      </figure>

      <figure class="obra" role="button" tabindex="0"
              data-img="imagenes/obra-02.webp"
              data-titulo="Rellenar" data-anio="" data-tecnica="">
        <div class="marco">
          <img src="imagenes/obra-02.webp" alt="Obra de Cecilia Quignón"
               width="1007" height="1400" loading="lazy" decoding="async">
        </div>
        <figcaption>Rellenar</figcaption>
      </figure>

      <figure class="obra" role="button" tabindex="0"
              data-img="imagenes/obra-03.webp"
              data-titulo="Rellenar" data-anio="" data-tecnica="">
        <div class="marco">
          <img src="imagenes/obra-03.webp" alt="Obra de Cecilia Quignón"
               width="896" height="1195" loading="lazy" decoding="async">
        </div>
        <figcaption>Rellenar</figcaption>
      </figure>

      <figure class="obra" role="button" tabindex="0"
              data-img="imagenes/obra-04.webp"
              data-titulo="Rellenar" data-anio="" data-tecnica="">
        <div class="marco">
          <img src="imagenes/obra-04.webp" alt="Obra de Cecilia Quignón"
               width="1160" height="1400" loading="lazy" decoding="async">
        </div>
        <figcaption>Rellenar</figcaption>
      </figure>

      <figure class="obra" role="button" tabindex="0"
              data-img="imagenes/obra-05.webp"
              data-titulo="Rellenar" data-anio="" data-tecnica="">
        <div class="marco">
          <img src="imagenes/obra-05.webp" alt="Obra de Cecilia Quignón"
               width="1033" height="1400" loading="lazy" decoding="async">
        </div>
        <figcaption>Rellenar</figcaption>
      </figure>

      <figure class="obra" role="button" tabindex="0"
              data-img="imagenes/obra-06.webp"
              data-titulo="Rellenar" data-anio="" data-tecnica="">
        <div class="marco">
          <img src="imagenes/obra-06.webp" alt="Obra de Cecilia Quignón"
               width="1400" height="1104" loading="lazy" decoding="async">

        <figcaption>Rellenar</figcaption>
      </figure>

    </div>
  </section>


  <!-- ===== 3. Contacto ===== -->
  <section id="contacto" class="contenedor">

    <div class="separador separador--completo">
      <span class="puntos" aria-hidden="true"></span>
      <h2>Contacto</h2>
    </div>

    <div class="contacto">
      <ul>
        <li>
          <a href="https://www.instagram.com/ceciliaquignon/"
             target="_blank" rel="noopener noreferrer">@ceciliaquignon</a>
        </li>
        <li>
          <!-- La direccion se monta con JS para que los bots de spam
               no la encuentren escrita en el HTML. -->
          <a id="email" href="#">correo</a>
        </li>
      </ul>

      <!-- Aviso de autoria. El ano se pone solo, no hay que actualizarlo. -->
      <p class="copyright">
        © <span id="anio-actual">2026</span> Cecilia Quignón.

</main>


<!-- ===== Lightbox (oculto hasta que se pulsa una obra) ===== -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true"
     aria-label="Obra ampliada" hidden>
  <button class="cerrar" id="cerrar-lightbox" aria-label="Cerrar">&times;</button>
  <div class="marco-grande"><img id="lb-img" src="" alt=""></div>
  <div class="ficha">
    <h3 id="lb-titulo">Rellenar</h3>
    <p id="lb-datos"></p>
  </div>
</div>


<script>
/* ============================================================
   A. Resaltar en la barra el enlace de la seccion visible
   ============================================================ */
(function () {
  var enlaces = {};
  document.querySelectorAll('.barra a').forEach(function (a) {
    enlaces[a.dataset.enlace] = a;
  });

  var observador = new IntersectionObserver(function (entradas) {
    entradas.forEach(function (e) {
      if (!e.isIntersecting) return;
      for (var k in enlaces) { enlaces[k].classList.remove('activo'); }
      if (enlaces[e.target.id]) { enlaces[e.target.id].classList.add('activo'); }
    });
  }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });

  ['sobre-mi', 'galeria', 'contacto'].forEach(function (id) {
    var s = document.getElementById(id);
    if (s) { observador.observe(s); }
  });
})();


/* ============================================================
   B. Email montado por trozos (anti-spam)
   Si cambia la direccion, cambiar estas dos variables.
   ============================================================ */
(function () {
  var usuario = 'ceciliaquignon';
  var dominio = 'gmail.com';
  var a = document.getElementById('email');
  if (!a) { return; }
  a.textContent = usuario + '@' + dominio;
  a.setAttribute('href', 'mailto:' + usuario + '@' + dominio);
})();


/* ============================================================
   B2. Ano del aviso de autoria, siempre al dia
   ============================================================ */
(function () {
  var anio = document.getElementById('anio-actual');
  if (anio) { anio.textContent = new Date().getFullYear(); }
})();


/* ============================================================
   C. Lightbox: ampliar la obra dentro de la misma pagina
   ============================================================ */
(function () {
  var caja   = document.getElementById('lightbox');
  var imagen = document.getElementById('lb-img');
  var titulo = document.getElementById('lb-titulo');
  var datos  = document.getElementById('lb-datos');
  var cerrar = document.getElementById('cerrar-lightbox');
  var ultima = null;   // obra pulsada, para devolverle el foco al cerrar

  function abrir(obra) {
    ultima = obra;
    var foto = obra.querySelector('img');

    imagen.src = obra.dataset.img || (foto ? foto.src : '');
    imagen.alt = foto ? foto.alt : '';

    titulo.textContent = obra.dataset.titulo || '';
    datos.textContent  = [obra.dataset.anio, obra.dataset.tecnica]
                           .filter(Boolean).join(' · ');
    caja.hidden = false;
    document.body.style.overflow = 'hidden';
    cerrar.focus();
  }

  function ocultar() {
    caja.hidden = true;
    imagen.removeAttribute('src');   // no dejar la foto cargada de fondo
    imagen.alt = '';
    document.body.style.overflow = '';
    if (ultima) { ultima.focus(); }
  }

  document.querySelectorAll('.obra').forEach(function (obra) {
    obra.addEventListener('click', function () { abrir(obra); });
    obra.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir(obra); }
    });
  });

  cerrar.addEventListener('click', ocultar);
  caja.addEventListener('click', function (ev) { if (ev.target === caja) { ocultar(); } });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !caja.hidden) { ocultar(); }
  });
})();
</script>

</body>
</html>
